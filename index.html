<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fangame Music Quiz</title>
    <link rel="icon" type="image/png" href="img/Icon.png" sizes="75x75">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="tsparticles"></div>

    <div id="Sound_Setting">
        <button id="btnSettingMusic">Music</button>
        <button id="btnSettingSound">Sounds</button>
        <div id="musicSettings" style="display: none;">
            <input type="range" id="rangeMusic" min="0" max="100" value="100">
        </div>
        <div id="soundSettings" style="display: none;">
            <input type="range" id="rangeSound" min="0" max="100" value="100">
        </div>
    </div>

    <div id="Screen_Loading">
        <button id="btnLoadCSV" onclick="">Load data</button>
    </div>

    <div id="Screen_Title">
        <div id="Title_Menu">
            <img id="Title" src="./img/title.png" alt="title"/>

            <div id="Title_Button">
                <button id="btnOptionMode" onclick="startOptionMode()">Option Mode</button>
                <button id="btnManualMode" onclick="startManualMode()">Manual Mode</button>
                <button id="btnRankedMode" onclick="activeRanked()">Ranked Mode</button>
            </div>
        </div>

        <div id="Config_Menu">
            <h3>Settings</h3>

            <!-- Número de Rondas -->
            <label for="roundsInput">Number of Questions:</label>
            <input type="number" id="roundsInput" min="1" value="20">

            <!-- Boton de Rondas Infinitas -->
            <button id="infiniteRoundsBtn">Infinite Question</button>

            <!-- Temporizador -->
            <label for="timerRange">Timer: <span id="timerValue">50</span>s</label>
            <input type="range" id="timerRange" min="20" max="60" value="50">

            <!-- Nombre de la musica -->
            <button id="musicNameBtn">Show Song Name: On</button>

            <!-- Mostrar video -->
            <button id="showVideoBtn">Show Video: On</button>

            <!-- Cargar un Excel custom -->
            <p>Customize FMQ Excel</p>
            <button id="btnLoadExcel" onclick="">Upload File</button>
            <input type="file" id="excelFileInput" accept=".xlsx,.xls" style="display:none">
        </div>

        <!-- Ranked Mode -->
        <div id="Ranked_Menu" style="display:none;">
            <h3>Ranked Mode</h3>

            <p>Enter your player name:</p>
            <input type="text" id="Ranked_PlayerName" maxlength="20" value="Player" placeholder="Your Name">

            <p class="Ranked_Label">Leaderboard Mode:</p>

            <select id="Ranked_LeaderboardMode">
                <option value="option">Option Mode</option>
                <option value="manual">Manual Mode</option>
            </select>

            <table id="Ranked_LeaderboardTable" class="Ranked_LeaderboardTable">
                <thead>
                    <tr>
                        <th>Top</th>
                        <th>Name</th>
                        <th>Score</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <h1 id="Ranked_Loading" style="display:none;">Loading...</h1>

            <div id="Ranked_Countdown">
                The leaderboards will be updated in: <span id="Ranked_Time"></span>
            </div>
        </div>
    </div>

    <!-- Start Game -->
    <div id="Screen_InGame">
        
        <div id="Report_Box">
            <button id="btnReport">⚠ REPORT</button>

            <div id="Report_Menu" style="display:none;">
                <h3>Report Issue</h3>

                <select id="Report_Reason">
                    <option value="video">Private/Delete video</option>
                    <option value="wrong">Incorrect fangame/song</option>
                    <option value="addfangame">Add missing fangame</option>
                </select>

                <input 
                    type="text" 
                    id="Report_AddFangame" 
                    placeholder="Fangame name"
                    style="display:none; margin-top:10px;">

                <button id="Report_Send">Submit</button>
            </div>
        </div>

        <h2 id="Game_Question">Question 1 - 20</h2>
        <h2 id="Game_Time">Time: 50.0</h2>

        <div id="Game_Video" margin-top: 20px;>
            <h1 id="Video_Name">Music Name</h1>
            <iframe id="Video_iframe" width="560" height="315" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            <button id="Video_Open">Open video</button>
        </div>

        <div id="Game_Option">
            <h3>Select a Answer</h3>
            <div id="GameOption_List" class="Game_OptionList"></div>
        </div>

        <div id="Game_Manual">
            <h3>Answer</h3>
            <input type="text" id="GameManual_Answer" placeholder="" list="GameManual_List"/>
            <div id="GameManual_Suggestion" class="GameManual_Suggestion"></div>
            <button id="GameManual_Submit" onclick="">Submit</button>
        </div>

        <div id="Game_Answer" style="display: none;">
            <h3 id="Answer_Text"></h3>
            <div id="Answer_Info"></div>
            <button id="btnContinue" onclick="">Continue</button>
            <button id="btnExit" onclick="">Exit</button>
        </div>
    </div>

    <div id="Screen_Result">
        <h2>Results</h2>
        <h1 id="Result_Score">Your Score</h1>
        <div id="Result_List"></div>

        <button id="btnBackMenu" onclick="">Back</button>
    </div>

    <!-- Soporte de CSV y Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- Firebase support -->
    <script type="module" src="firebase.js"></script>
    <script src="script.js"></script>

    <!-- Particles -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
    <script src="particles.js"></script>
</body>
</html>
